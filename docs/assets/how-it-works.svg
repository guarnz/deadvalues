<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
  <title id="t">How deadvalues works</title>
  <desc id="d">The chart is rendered with your values, then each key is removed, the chart rendered again and the manifests compared. A change means the key is alive; no change means dead, redundant or conditional.</desc>
  <style>
    .bg { fill: #0d1117; stroke: #30363d; }
    .node { fill: #161b22; stroke: #3d444d; stroke-width: 1.2; }
    .in { fill: #161b22; stroke: #58a6ff; stroke-width: 1.2; }
    .title { fill: #e6edf3; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub { fill: #9198a1; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { fill: #e6edf3; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { fill: #9198a1; font: italic 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .flow { fill: none; stroke: #58a6ff; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
    .loop { fill: none; stroke: #8b949e; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
    .pill { stroke-width: 1.2; }
    .st { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .alive { fill: #3fb950; } .dead { fill: #ff7b72; } .redundant { fill: #e3b341; } .conditional { fill: #d2a8ff; }
    .p-alive { fill: #3fb95014; stroke: #3fb950; } .p-dead { fill: #ff7b7214; stroke: #ff7b72; }
    .p-redundant { fill: #e3b34114; stroke: #e3b341; } .p-conditional { fill: #d2a8ff14; stroke: #d2a8ff; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    .pulse.k2 { animation-delay: 1s; } .pulse.k3 { animation-delay: 2s; } .pulse.k4 { animation-delay: 3s; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0%, 100% { opacity: .5; } 12%, 25% { opacity: 1; } 40% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { .flow, .loop, .pulse { animation: none; } .pulse { opacity: 1; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#58a6ff"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="249" rx="12"/>

  <rect class="in" x="20" y="66" width="120" height="44" rx="8"/>
  <text class="mono" x="80" y="93" text-anchor="middle">chart</text>
  <rect class="in" x="20" y="130" width="120" height="44" rx="8"/>
  <text class="mono" x="80" y="157" text-anchor="middle">values.yaml</text>

  <rect class="node" x="172" y="89" width="144" height="62" rx="8"/>
  <text class="title" x="244" y="116" text-anchor="middle">render</text>
  <text class="sub" x="244" y="136" text-anchor="middle">Helm SDK, in memory</text>

  <rect class="node" x="352" y="89" width="144" height="62" rx="8"/>
  <text class="title" x="424" y="116" text-anchor="middle">remove a key</text>
  <text class="sub" x="424" y="136" text-anchor="middle">a whole subtree first</text>

  <rect class="node" x="532" y="89" width="128" height="62" rx="8"/>
  <text class="title" x="596" y="116" text-anchor="middle">render again</text>
  <text class="sub" x="596" y="136" text-anchor="middle">without it</text>

  <rect class="node" x="696" y="89" width="104" height="62" rx="8"/>
  <text class="title" x="748" y="116" text-anchor="middle">compare</text>
  <text class="sub" x="748" y="136" text-anchor="middle">noise masked</text>

  <path class="flow" d="M140 88 C 156 88, 154 112, 170 114" marker-end="url(#a)"/>
  <path class="flow" d="M140 152 C 156 152, 154 128, 170 126" marker-end="url(#a)"/>
  <path class="flow" d="M316 120 H 350" marker-end="url(#a)"/>
  <path class="flow" d="M496 120 H 530" marker-end="url(#a)"/>
  <path class="flow" d="M660 120 H 694" marker-end="url(#a)"/>

  <path class="loop" d="M748 151 C 748 222, 424 222, 424 153" marker-end="url(#g)"/>
  <text class="label" x="586" y="234" text-anchor="middle">next key; one level deeper when the output changed</text>

  <path class="flow" d="M800 104 C 818 104, 818 51, 836 51"/>
  <path class="flow" d="M800 114 C 818 114, 818 97, 836 97"/>
  <path class="flow" d="M800 126 C 818 126, 818 143, 836 143"/>
  <path class="flow" d="M800 136 C 818 136, 818 189, 836 189"/>

  <g class="pulse">
    <rect class="pill p-alive" x="836" y="34" width="106" height="34" rx="17"/>
    <text class="st alive" x="889" y="55" text-anchor="middle">ALIVE</text>
  </g>
  <g class="pulse k2">
    <rect class="pill p-dead" x="836" y="80" width="106" height="34" rx="17"/>
    <text class="st dead" x="889" y="101" text-anchor="middle">DEAD</text>
  </g>
  <g class="pulse k3">
    <rect class="pill p-redundant" x="836" y="126" width="106" height="34" rx="17"/>
    <text class="st redundant" x="889" y="147" text-anchor="middle">REDUNDANT</text>
  </g>
  <g class="pulse k4">
    <rect class="pill p-conditional" x="836" y="172" width="106" height="34" rx="17"/>
    <text class="st conditional" x="889" y="193" text-anchor="middle">CONDITIONAL</text>
  </g>
</svg>
