apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/cases
      sourceRef:
        kind: GitRepository
        name: platform
  valuesFrom:
    - kind: ConfigMap
      name: demo-values
  values:
    name: demo
    service:
      prot: 8080
    ingress:
      host: ${app_domain:=demo.example.com}
