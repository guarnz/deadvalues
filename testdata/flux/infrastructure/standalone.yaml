apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform
  namespace: infra
spec:
  interval: 10m
  url: https://example.com/platform
---
apiVersion: v1
kind: Secret
metadata:
  name: standalone-secret-values
  namespace: infra
stringData:
  values.yaml: ENC[AES256_GCM,data:abc,type:str]
sops:
  version: 3.9.0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: standalone-tag
  namespace: infra
data:
  tag: "1.29"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: standalone
  namespace: infra
spec:
  interval: 10m
  targetNamespace: web
  chart:
    spec:
      chart: ./charts/cases
      sourceRef:
        kind: GitRepository
        name: platform
  valuesFrom:
    - kind: Secret
      name: standalone-secret-values
    - kind: ConfigMap
      name: standalone-tag
      valuesKey: tag
      targetPath: image.tag
    - kind: ConfigMap
      name: missing-optional
      optional: true
  values:
    name: standalone
    replicas: 2
    service:
      prot: 9090
