name: Feature request
description: A new chart format, flag, output or check
labels:
  - enhancement
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would this be useful
      description: The problem it solves, ideally with a real example.
    validations:
      required: true
