name: Bug report
description: deadvalues fails, crashes or does not do what the docs say
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        A key reported with the wrong status is a **False positive**; please use that form instead.
  - type: dropdown
    id: source
    attributes:
      label: Where do your apps come from?
      options:
        - Argo CD Application
        - Flux HelmRelease
        - Chart and values (--chart / -f)
        - GitHub Action
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: deadvalues version
      description: Output of `deadvalues version`.
      placeholder: v0.1.5
    validations:
      required: true
  - type: input
    id: chart
    attributes:
      label: Chart and version
      placeholder: app-template 5.3.0
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: The command you ran and the full output or error.
      render: text
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: How to reproduce
      description: The smallest values file and manifest that show it. Remove secrets first.
      render: yaml
