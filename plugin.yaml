name: deadvalues
version: 0.1.1
usage: Find Helm values that have no effect on the rendered chart
description: Finds the Helm values that have no effect, and the ones a chart upgrade silently breaks.
platformCommand:
  - os: windows
    command: $HELM_PLUGIN_DIR\bin\deadvalues.exe
  - command: $HELM_PLUGIN_DIR/bin/deadvalues
hooks:
  install: cd $HELM_PLUGIN_DIR && sh ./scripts/install-plugin.sh
  update: cd $HELM_PLUGIN_DIR && sh ./scripts/install-plugin.sh
