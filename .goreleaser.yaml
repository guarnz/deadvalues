version: 2
project_name: deadvalues
before:
  hooks:
    - go mod tidy
builds:
  - id: deadvalues
    main: ./cmd/deadvalues
    binary: deadvalues
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true
dockers_v2:
  - id: image
    ids:
      - deadvalues
    images:
      - ghcr.io/guarnz/deadvalues
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/guarnz/deadvalues
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
docker_signs:
  - artifacts: manifests
    args:
      - sign
      - ${artifact}@${digest}
      - --yes
git:
  ignore_tags:
    - "{{ if not .Prerelease }}*-*{{ end }}"
release:
  prerelease: auto
  header: |
    Download deadvalues {{ .Tag }} for your system:

    - [Linux amd64](https://github.com/guarnz/deadvalues/releases/download/{{ .Tag }}/deadvalues_linux_amd64.tar.gz) (Intel or AMD)
    - [Linux arm64](https://github.com/guarnz/deadvalues/releases/download/{{ .Tag }}/deadvalues_linux_arm64.tar.gz) (Raspberry Pi, Graviton, Ampere)
    - [macOS arm64](https://github.com/guarnz/deadvalues/releases/download/{{ .Tag }}/deadvalues_darwin_arm64.tar.gz) (Apple silicon, M1 and later)
    - [macOS amd64](https://github.com/guarnz/deadvalues/releases/download/{{ .Tag }}/deadvalues_darwin_amd64.tar.gz) (Intel)
    - [Windows amd64](https://github.com/guarnz/deadvalues/releases/download/{{ .Tag }}/deadvalues_windows_amd64.zip) (Intel or AMD)
    - [Windows arm64](https://github.com/guarnz/deadvalues/releases/download/{{ .Tag }}/deadvalues_windows_arm64.zip) (Snapdragon)

    `checksums.txt` is signed with cosign by this repository's release workflow (keyless, bundle in `checksums.txt.sigstore.json`). To verify a download, see [verifying a release](https://github.com/guarnz/deadvalues/blob/main/docs/install.md#verifying-a-release).

    Other ways to install (Go, Helm plugin from [Artifact Hub](https://artifacthub.io/packages/helm-plugin/deadvalues/deadvalues), container image): see the [install guide](https://github.com/guarnz/deadvalues/blob/main/docs/install.md).
changelog:
  use: github
  format: "{{ .SHA }}: {{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}"
  filters:
    include:
      - '^.*?(feat|fix|perf)(\(.+\))??!?:.+$'
      - '^.*?build\(deps\):.+$'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Dependencies
      regexp: '^.*?build\(deps\):.+$'
      order: 3
